<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Titanic Survival Prediction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Titanic Survival Prediction</h1>

    <form id="predictionForm">
      <label>Pclass</label>
      <input type="number" id="Pclass" required>

      <label>Sex</label>
      <select id="Sex">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <label>Age</label>
      <input type="number" id="Age" step="0.1" required>

      <label>Siblings / Spouses (SibSp)</label>
      <input type="number" id="SibSp" required>

      <label>Parents / Children (Parch)</label>
      <input type="number" id="Parch" required>

      <label>Fare</label>
      <input type="number" id="Fare" step="0.01" required>

      <button type="submit">Predict</button>
    </form>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
